<svg xmlns="http://www.w3.org/2000/svg" viewBox="69 34.5 88 88" width="88" height="88">
  <!--
    Favicon vychází přímo z loga (brief 23. 8. 2026, bod 1): navy plocha
    s kaligrafickou křivkou vykrojenou do bílé. Wordmark se do 16px favikony
    čitelně nevejde, proto v ní není — křivka je stejně to, co má být na
    značce poznat.

    Výřez NENÍ celý blok loga (144 × 144). Křivka je v něm hodně široká
    a nízká, takže na 16px favikoně z ní zbyl světlý zásek a nic víc.
    Rám je proto stažený na 88 × 88 se středem v prohnutí křivky: křídla
    vybíhají za okraj — přesně jako v logu, kde přesahují blok — a tvar je
    čitelný i v liště panelů. Ověřeno vykreslením na 64, 32 a 16 px.

    Dřívější favikona (kruhová pečeť s vránou) byla jedna z AI navržených variant
    loga, které klientka odmítla, proto je pryč.

    Barva je `--color-deep` z `globals.css` (#0B1F3A) zapsaná natvrdo — soubor
    se servíruje samostatně, mimo stránku, takže se na CSS proměnné nedostane.
    Při změně navy na webu se musí přepsat i tady.
  -->
